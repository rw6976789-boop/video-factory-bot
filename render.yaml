services:
  - type: worker
    name: video-factory-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    disk:
      name: videodata
      mountPath: /data
      sizeGB: 20
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATA_DIR
        value: /data
